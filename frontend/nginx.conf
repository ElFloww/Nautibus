# Point d'entrée unique de Nautibus, derrière Nginx Proxy Manager (NPM) qui assure HTTPS.
# Fichiers du site + relais de /api, /hubs (WebSocket SignalR) et /health vers l'API.

# En-têtes reçus de NPM transmis tels quels : l'API garde la dernière adresse de X-Forwarded-For,
# c'est-à-dire celle du client vue par NPM. Sans NPM devant (accès direct), on retombe sur l'adresse de connexion.
map $http_x_forwarded_for $nautibus_forwarded_for {
  ""      $remote_addr;
  default $http_x_forwarded_for;
}
map $http_x_forwarded_proto $nautibus_forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}
map $http_upgrade $nautibus_connection_upgrade {
  ""      "";
  default upgrade;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Les add_header d'un bloc location remplacent ceux du serveur : chaque bloc inclut donc les en-têtes de sécurité.
  include /etc/nginx/nautibus-headers.conf;

  location ~ ^/(api|hubs|health)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $nautibus_forwarded_for;
    proxy_set_header X-Forwarded-Proto $nautibus_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nautibus_connection_upgrade;
    # SignalR : connexions longues, réponses en flux.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Service worker et manifeste : jamais en cache, pour que les mises à jour soient prises.
  location = /sw.js { include /etc/nginx/nautibus-headers.conf; add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { include /etc/nginx/nautibus-headers.conf; add_header Cache-Control "no-cache"; }
  location /assets/ { include /etc/nginx/nautibus-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { include /etc/nginx/nautibus-headers.conf; try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}