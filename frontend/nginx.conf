# Fichiers du site uniquement : /api, /hubs et /health sont routés vers l'API par Caddy.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Service worker et manifeste : jamais en cache, pour que les mises à jour soient prises.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
